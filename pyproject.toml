[project]
name = "fdtd.py"
version = "0.0.3"
description = "Finite-difference time-domain electromagnetic simulations"
license = "MIT"
authors = [{name = "Tiago Vilela", email = "tiagovla@gmail.com"}]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
readme = "README.md"
dependencies = [
    "numpy>=1.19.5",
    "tqdm>=4.57.0",
]

[dependency-groups]
dev = [
    "pytest>=5.2",
    "matplotlib>=3.3.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["fdtd"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.optional-dependencies]
plot = ["matplotlib>=3.3.3"]
examples = [
    "matplotlib>=3.3.3", "scipy>=1.6.1",
    "morpho.py>=0.1.0; python_version < '3.16'",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/tiagovla/fdtd.py"
Repository = "https://github.com/tiagovla/fdtd.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
