[project]
name = "fdtd.py"
version = "0.0.3"
description = ""
license = "MIT"
authors = [{name = "Tiago Vilela", email = "tiagovla@gmail.com"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.5",
    "tqdm>=4.57.0",
    "matplotlib>=3.3.3",
]

[dependency-groups]
dev = [
    "pytest>=5.2",
]

[tool.poetry]
packages = [
    {include = "fdtd", from="."}
]

[project.optional-dependencies]
docs = [
    "Sphinx>=3.5.1",
    "sphinx-rtd-theme>=0.5.1",
    "sphinx-autodoc-typehints>=1.11.1",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
