site_name: fdtd.py
site_description: Finite-difference time-domain electromagnetic simulations
site_url: https://tiagovla.github.io/fdtd.py/
repo_url: https://github.com/tiagovla/fdtd.py

nav:
  - Home: index.md
  - API reference: api.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            members_order: source
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false

extra_css:
  - extra.css
